[package]
name = "quai-consensus"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
quai-primitives = { path = "../quai-primitives" }
quai-execution = { path = "../quai-execution" }
quai-store = { path = "../quai-store" }
crypto-bigint = { version = "=0.5.5", default-features = false }
sha3 = "=0.10.8"
sha2 = "=0.10.9"
hmac = "=0.12.1"
prost = "=0.14.4"
k256 = { version = "=0.13.4", default-features = false, features = ["schnorr", "std"] }

serde_json = "=1.0.154"

[dev-dependencies]
redb = "=4.5.0"
