[package]
name = "quai-network"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[features]
native-transport = ["dep:quai-consensus","dep:libp2p", "dep:tokio", "dep:futures", "dep:async-trait", "dep:libp2p-stream"]

[dependencies]
quai-consensus = { path = "../quai-consensus", optional = true }
quai-primitives = { path = "../quai-primitives" }
prost = "=0.14.4"
libp2p = { version = "=0.56.0", optional = true, default-features = false, features = ["tokio", "tcp", "noise", "yamux", "request-response", "gossipsub", "identify", "kad", "macros", "ed25519"] }
tokio = { version = "=1.54.1", optional = true, features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-std", "io-util"] }
futures = { version = "=0.3.31", optional = true }
async-trait = { version = "=0.1.89", optional = true }
libp2p-stream = { version = "=0.4.0-alpha", optional = true }

[dev-dependencies]
quai-execution = { path = "../quai-execution" }
quai-consensus = { path = "../quai-consensus" }
quai-store = { path = "../quai-store" }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision"] }

[[example]]
name = "private-peer"
required-features = ["native-transport"]

[[example]]
name = "private-replay"
required-features = ["native-transport"]

[[example]]
name = "canonical-sync"
required-features = ["native-transport"]

[[example]]
name = "private-node"
required-features = ["native-transport"]
