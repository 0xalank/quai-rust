[package]
name = "quai-node"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[[bin]]
name = "quai-node"
path = "src/main.rs"

[dependencies]
quai-primitives = { path = "../quai-primitives" }
quai-consensus = { path = "../quai-consensus" }
crypto-bigint = { version = "=0.5.5", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
