[package]
name = "quai-node"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[[bin]]
name = "quai-node"
path = "src/main.rs"

[dependencies]
quai-primitives = { path = "../quai-primitives" }
quai-consensus = { path = "../quai-consensus" }
quai-execution = { path = "../quai-execution" }
quai-store = { path = "../quai-store" }
quai-rpc = { path = "../quai-rpc" }
quai-network = { path = "../quai-network", features = ["native-transport"] }
libp2p = { version = "=0.56.0", default-features = false, features = ["tokio", "tcp", "dns", "noise", "yamux", "request-response", "gossipsub", "identify", "kad", "macros", "ed25519", "relay", "dcutr", "autonat"] }
crypto-bigint = { version = "=0.5.5", default-features = false }
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "schnorr", "std"] }
prost = "=0.14.4"
redb = "=4.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net", "io-util"] }
