[package]
name = "quai-primitives"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[dependencies]
blake3 = { version = "=1.8.7", default-features = false, features = ["std", "pure"] }
prost = "=0.14.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision"] }
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "schnorr", "std"] }
secp256k1 = { version = "=0.33.1", default-features = false, features = ["std", "recovery"] }
sha3 = { version = "=0.10.8", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
